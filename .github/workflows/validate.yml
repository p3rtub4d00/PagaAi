name: Validate PagaAi

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/cadastro-beneficiario-documentos-2026-11-06

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server syntax
        run: node --check server.js
      - name: Check browser script syntax
        run: node --check public/app.js
      - name: Validate package manifest
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json válido')"
